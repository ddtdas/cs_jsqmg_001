name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify OpenAPI export matches committed docs/openapi.json (P9)
        run: |
          python scripts/export_openapi.py --out /tmp/openapi.json
          python - <<'EOF'
          import json, sys
          a = json.load(open('/tmp/openapi.json', encoding='utf-8'))
          b = json.load(open('docs/openapi.json', encoding='utf-8'))
          print(f"exported={len(a.get('paths', {}))} paths, committed={len(b.get('paths', {}))} paths")
          sys.exit(0 if a == b else 1)
          EOF